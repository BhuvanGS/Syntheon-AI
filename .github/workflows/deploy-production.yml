name: Deploy Production

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      SST_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL }}
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL }}
      NEXT_PUBLIC_VERCEL_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_VERCEL_ANALYTICS_ID }}
      CLERK_TELEMETRY_DISABLED: ${{ secrets.CLERK_TELEMETRY_DISABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::565139240803:role/GitHubActionsSSTDeploy
          role-duration-seconds: 3600
          aws-region: ap-south-1

      - name: Cache SST platform
        uses: actions/cache@v4
        with:
          path: .sst
          key: sst-platform-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'sst.config.ts') }}
          restore-keys: |
            sst-platform-${{ runner.os }}-

      - name: Verify SST CLI
        run: pnpm exec sst version

      - name: Set SST secrets
        env:
          STAGE: production
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SKRIBBY_API_KEY: ${{ secrets.SKRIBBY_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          SKRIBBY_WEBHOOK_SECRET: ${{ secrets.SKRIBBY_WEBHOOK_SECRET }}
          WEBHOOK_ACCESS_TOKEN: ${{ secrets.WEBHOOK_ACCESS_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          PRIVACY_DELETION_SECRET: ${{ secrets.PRIVACY_DELETION_SECRET }}
        run: bash .github/scripts/ci-set-sst-secrets.sh

      - name: Deploy to production
        run: pnpm exec sst deploy --stage production --print-logs
